name: secret-scan

# Gate pencegahan: repo ini PUBLIC, jadi kredensial yang lolos ke commit = langsung bocor.
# Ditambahkan setelah insiden 2 token bot Telegram ter-commit di transkrip sesi (16 Sep 2026).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for credentials
        run: python3 scripts/secret_scan.py
